name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure Gradle Wrapper Jar
        run: |
          cd android
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ] || ! unzip -p gradle/wrapper/gradle-wrapper.jar org/gradle/wrapper/GradleWrapperMain.class >/dev/null 2>&1; then
            echo "Restoring valid gradle-wrapper.jar..."
            curl -sSL -L "https://raw.githubusercontent.com/ionic-team/capacitor/main/android/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          wrapper-validation-enabled: false

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Signing Secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "::error::ANDROID_KEYSTORE secret is missing. Please configure it in your GitHub repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is missing. Please configure it in your GitHub repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::KEY_ALIAS secret is missing. Please configure it in your GitHub repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::KEY_PASSWORD secret is missing. Please configure it in your GitHub repository secrets."
            exit 1
          fi
          echo "All signing secrets verified!"

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/release.keystore

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-artifacts
          mv android/app/build/outputs/apk/release/app-release.apk build-artifacts/Radiology_Prep_MCQ.apk
          echo "Signed Release APK successfully compiled and renamed!"

      - name: Delete Previous Release & Tag
        run: |
          echo "Checking for previous 'latest' release..."
          gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Radiology Prep MCQ - Latest Build"
          body: |
            This is the latest production-ready Android release of the Radiology Prep MCQ application.
            
            ### Installation Guide
            1. Download the `Radiology_Prep_MCQ.apk` below.
            2. Open the file on your Android device.
            3. Allow "Install from Unknown Sources" if prompted by Android.
            4. Install and enjoy!
            
            *Automatically compiled and signed via GitHub CI/CD pipeline.*
          draft: false
          prerelease: false
          files: build-artifacts/Radiology_Prep_MCQ.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
